services:
  # -----------------------------------------------------------
  # Backend Web Service
  # -----------------------------------------------------------
  - type: web
    name: hostel-management-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@hostelpro.com
      - key: ADMIN_PASSWORD
        sync: false

  # -----------------------------------------------------------
  # Frontend Static Site
  # -----------------------------------------------------------
  - type: web
    name: hostel-management-frontend
    runtime: static
    plan: free
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
